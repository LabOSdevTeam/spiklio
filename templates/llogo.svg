<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B2CFF"/>
      <stop offset="0.55" stop-color="#4D4BFF"/>
      <stop offset="1" stop-color="#247BFF"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2CFF"/>
      <stop offset="0.55" stop-color="#7550FF"/>
      <stop offset="1" stop-color="#35A5FF"/>
    </linearGradient>
  </defs>

  <!-- Circle Core: two clean, symmetric C-shaped arcs -->
  <path d="M -18 -54 A 57 57 0 0 0 -18 54"
        fill="none" stroke="url(#left)" stroke-width="27"
        stroke-linecap="round"/>
  <path d="M 18 -54 A 57 57 0 0 1 18 54"
        fill="none" stroke="url(#right)" stroke-width="27"
        stroke-linecap="round"/>

  <!-- Four-point AI core -->
  <path d="M 0 -27
           C 4 -10 10 -4 27 0
           C 10 4 4 10 0 27
           C -4 10 -10 4 -27 0
           C -10 -4 -4 -10 0 -27 Z"
        fill="#F4F7FF"/>
</svg>
